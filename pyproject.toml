[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strain-bench"
version = "0.3.0"
description = "ML platform for estimating ring strain energy of carbocycles and heterocycles, with an isodesmic/homodesmotic/hyperhomodesmotic reaction-scheme comparator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Strain Bench contributors" }
]
keywords = [
    "cheminformatics", "ring-strain", "SMILES", "machine-learning",
    "computational-chemistry", "medicinal-chemistry", "homodesmotic",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "flask>=3.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
rdkit = ["rdkit>=2023.9"]

[project.urls]
Homepage = "https://github.com/your-org/strain-bench"
Issues = "https://github.com/your-org/strain-bench/issues"

[project.scripts]
strain-bench-predict = "ringstrain.predict:_main"
strain-bench-train = "ringstrain.model:main"

[tool.setuptools.packages.find]
include = ["ringstrain*"]

[tool.setuptools.package-data]
ringstrain = ["data/*.csv"]
